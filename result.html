<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
    <link rel="stylesheet" href="Result.css">
</head>

<body>

<div class="bg"></div>

<header>
    <h1>RESULT</h1>
</header>

<div class="result">

    <div class="song-info">
        <h2>Voyager</h2>
        <p>Composer : takawan</p>
    </div>


    <div class="judge">

        <div class="judge-item">
            <span class="label perfect">PERFECT</span>
            <span></span>
        </div>

        <div class="judge-item">
            <span class="label great">GREAT</span>
            <span>32</span>
        </div>


        <div class="judge-item">
            <span class="label miss">MISS</span>
            <span>2</span>
        </div>

    </div>


    <div class="score-box">
        <p>SCORE</p>
        <h1>987,654</h1>
    </div>


    <div class="buttons">
        <button class="retry">RETRY</button>
        <button class="home">HOME</button>
    </div>

</div>

<script src="Result.js"></script>

</body>
</html>
