<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Song Select</title>

    <link rel="stylesheet" href="Select.css">
</head>

<body>
    <div class="bg"></div>

    <header>
        <h1>🎵SONG SELECT🎵</h1>
    </header>

    <button class="back-btn">◀ BACK</button>



<div class="levels">
    <button class="level-btn" data-level="All">All</button>      
    <button class="level-btn" data-level="8">Level 8</button>    
    <button class="level-btn" data-level="9">Level 9</button>
    <button class="level-btn active" data-level="10">Level 10</button>
    <button class="level-btn" data-level="11">Level 11</button>
    <button class="level-btn" data-level="12">Level 12</button>
</div>
<div class="main-area"> 
    <section class="songs">
        <div class="card" data-level="8">
             <h2>Voyager</h2>
            <p class="artist">作曲者名</p>
             <p class="level">Lv8</p>
        </div>

        <div class="card selected" data-level="9">
            <h2>Voyager</h2>
            <p>takawan</p>
            <p>Lv9</p>
        </div>

        <div class="card" data-level="10">
             <h2>Voyager</h2>
            <p class="artist">作曲者名</p>
             <p class="level">Lv10</p>
        </div>

        <div class="card" data-level="11">
             <h2>Voyager</h2>
            <p class="artist">作曲者名</p>
             <p class="level">Lv11</p>
        </div>

        <div class="card" data-level="12">
             <h2>Voyager</h2>
            <p class="artist">作曲者名</p>
             <p class="level">Lv12</p>
        </div>
    </section>
    
    <aside class="info">
    <button class="game-start" style="display:none;">
        GAME START
    </button>

    <h2>選択中</h2>
    <p>曲情報表示</p>
</aside>


</div> 


    <script src="Select.js"></script>
</body>
</html>
