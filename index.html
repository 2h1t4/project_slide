<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Simple Rhythm Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <div id="ui">
        <div>SCORE : 000000</div>
        <div>COMBO : 0</div>
        <div>LIFE : red</div>
    </div>

    <!-- ノーツ置き場 -->
    <div id="notes">
        <div class="note" style="left:100px; top:100px;"></div>
        <div class="note" style="left:300px; top:200px;"></div>
        <div class="note" style="left:500px; top:150px;"></div>
    </div>

    <!-- プレイヤー -->
    <div id="player"></div>

</div>

</body>
<script src="script.js"></script>
</html>
