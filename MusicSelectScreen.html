<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Game</title>

<link rel="stylesheet" href="Music_Select_Screen.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>

<div class="container">

    <h1>RHYTHM GAME</h1>

    <div class="line"></div>

    <p class="menu">SONG SELECT</p>

    <div class="cards">

        <div class="card blue">

            <div class="icon">🎵</div>

            <h2>Selection</h2>


  

        </div>

        <div class="card pink">

            <div class="icon">🎹</div>

            <h2>Production</h2>


        </div>

    </div>

    <div class="buttons">

        <button>SETTING</button>
        <button>HELP</button>
        <button>BACK</button>

    </div>

</div>

</body>
</html>
