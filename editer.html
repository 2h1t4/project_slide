<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Simple Rhythm Game editer</title>
    <link rel="stylesheet" href="style_editer.css">
</head>
<body>
<audio id="music" src="ECM II OP_8551.mp3"></audio>
<div id="game">
    <div id = "editerarea">
        
        <div id = "gridLine">

        </div>
        <!-- ノーツ置き場 -->
        <div id="notes">

        </div>
    </div>
    <!-- プレイヤー -->
    <div id="player"></div>

    
    
</div>

<div id="ui">
        <div id = "score"></div>
        <div id = "combo"></div>
        <div id = "life">LIFE : red</div>
    </div>

    <div id = "judgeText"></div>
    <div id = "judgeTime"></div>

<div id="gridButtons">
    <button onclick="changeGrid(4)">4分</button>
    <button onclick="changeGrid(8)">8分</button>
    <button onclick="changeGrid(16)">16分</button>
    <button onclick="changeGrid(24)">24分</button>
    <button onclick="changeGrid(32)">32分</button>
</div>
<div id="controls">
    <input type="file" id="chartInput" accept=".json" style="display:none;">
    <button onclick="document.getElementById('chartInput').click()">JSONを読み込む</button>
    <button onclick="location.href='index.html'">ゲームへ</button>
    <button onclick="saveChart(chart)">保存</button>
</div>

<script src="editer_script.js"></script>
</html>
