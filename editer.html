<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Simple Rhythm Game editer</title>
    <link rel="stylesheet" href="style_editer.css">
</head>
<body>
<audio id="music" src="ashitanotenki_5850.mp3"></audio>
<div id="game">

    <div id="ui">
        <div id = "score"></div>
        <div id = "combo"></div>
        <div id = "life">LIFE : red</div>
    </div>
    <div id = "gridLine">
        
    </div>
    <!-- ノーツ置き場 -->
    <div id="notes">
        
    </div>

    <!-- プレイヤー -->
    <div id="player"></div>

    <div id = "judgeText"></div>
    <div id = "judgeTime"></div>
</div>
<div id="controls">
    <input type="file" id="chartInput" accept=".json" style="display:none;">
    <button onclick="document.getElementById('chartInput').click()">JSONを読み込む</button>
    <button onclick="location.href='index.html'">ゲームへ</button>
</div>

<script src="editer_script.js"></script>
</html>
